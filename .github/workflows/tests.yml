name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PSC_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: python -m pip install pytest pillow
      # Fails on a red test, a suite that did not run, or a test function that never ran
      # (tools/functions_ran.py names it). No check floors: nothing to edit per PR.
      - run: bash tools/run_tests.sh
        shell: bash
      - name: Map previews (built from the committed map data)
        shell: bash
        run: python tools/maps/preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: map-previews
          path: out/previews/*.png
          if-no-files-found: error
